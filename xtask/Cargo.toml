[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
toml = "0.9"
kortex-contract = { path = "../crates/kortex-contract" }
serde_json = "1"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
kortex-pkg = { path = "../crates/kortex-pkg" }
kortex-catalog = { path = "../crates/kortex-catalog" }
flate2 = "1"
tar = { version = "0.4", default-features = false }
getrandom = "0.3"
