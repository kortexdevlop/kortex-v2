schema = 1
[tool]
id = "code.html-entities"
version = "1.0.0"
universe = "code"
status = "beta"
ui = "auto"
platforms = ["web", "desktop"]
offline = true
ai = false
viral_priority = 1
[tool.name]
fr = "Entités HTML"
en = "HTML Entities"
[tool.tagline]
fr = "Échappez le texte pour HTML ou décodez les références de caractères courantes."
en = "Escape text for HTML or decode common character references."
[tool.slug]
fr = "entites-html"
en = "html-entities"
[search]
keywords.fr = ["entités html", "entites html"]
keywords.en = ["html entities", "html entities"]
intents.fr = ["Échappez le texte pour HTML ou décodez les références de caractères courantes."]
intents.en = ["Escape text for HTML or decode common character references."]
related = []
[limits]
timeout_s = 10

[[inputs]]
id = "text"
type = "text"
required = true
max_len = 100000
multiline = true
label = { fr = "Texte", en = "Text" }

[[params]]
id = "direction"
type = "enum"
default = "encode"
level = "simple"
label = { fr = "Conversion", en = "Conversion" }
options = ["encode", "decode"]

[[outputs]]
id = "text"
type = "text"

[permissions]
network = false
filesystem = "none"
clipboard = "write"
sensitive = false
privacy = "local"
