schema = 1

[tool]
id = "{{id}}"
version = "0.1.0"
universe = "{{universe}}"
status = "draft"
ui = "auto"
platforms = ["web", "desktop"]
offline = true
ai = false
viral_priority = 3

[tool.name]
fr = "{{Name}}"
en = "{{Name}}"
[tool.tagline]
fr = "À compléter."
en = "To complete."
[tool.slug]
fr = "{{name}}"
en = "{{name}}"

[search]
keywords.fr = ["{{name}}"]
keywords.en = ["{{name}}"]
intents.fr = []
intents.en = []
related = []

[limits]
max_input_bytes = "10MB"
timeout_s = 30

[[inputs]]
id = "text"
type = "text"
required = true
max_len = 100000
label = { fr = "Texte", en = "Text" }

[[outputs]]
id = "text"
type = "text"

[permissions]
network = false
filesystem = "none"
clipboard = "write"
sensitive = false
privacy = "local"
