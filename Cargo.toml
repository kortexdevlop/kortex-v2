[workspace]
resolver = "3"
members = ["xtask", "crates/*", "tools/*/*", "apps/*"]
exclude = ["tools/_template"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# NOTE: never set `strip = true` (breaks wasm-bindgen, see docs/spikes.md)
