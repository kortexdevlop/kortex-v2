[package]
name = "kortex-mind"
version = "0.1.1"
edition.workspace = true
publish.workspace = true

[lib]
name = "kortex_mind"
path = "src/lib.rs"

[[bin]]
name = "kortex-mind"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
kortex-shell = { path = "../../crates/kortex-shell" }
kortex-ui = { path = "../../crates/kortex-ui" }
kortex-i18n = { path = "../../crates/kortex-i18n" }
kortex-contract = { path = "../../crates/kortex-contract" }
kortex-runtime = { path = "../../crates/kortex-runtime" }
kortex-workflow = { path = "../../crates/kortex-workflow" }
kortex-search = { path = "../../crates/kortex-search" }
kortex-ai = { path = "../../crates/kortex-ai" }
kortex-ai-client = { path = "../../crates/kortex-ai-client" }
kortex-auth = { path = "../../crates/kortex-auth" }
kortex-platform = { path = "../../crates/kortex-platform", features = ["document"] }
dioxus = { version = "0.7.10", features = ["macro", "html", "signals", "hooks", "document", "launch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kortex-pkg = { path = "../../crates/kortex-pkg" }
