[package]
name = "kortex-store"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "kortex_store"
path = "src/lib.rs"

[[bin]]
name = "kortex-store"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
kortex-pkg = { path = "../../crates/kortex-pkg" }
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
