[package]
name = "kortex-store"
version = "0.3.2"
edition.workspace = true
publish.workspace = true

[lib]
name = "kortex_store"
path = "src/lib.rs"

[[bin]]
name = "kortex-store"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
kortex-platform = { path = "../../crates/kortex-platform" }
kortex-ui = { path = "../../crates/kortex-ui" }
kortex-i18n = { path = "../../crates/kortex-i18n" }
dioxus = { version = "0.7.10", features = ["macro", "html", "signals", "hooks", "document", "launch"] }
kortex-shell = { path = "../../crates/kortex-shell" }
kortex-contract = { path = "../../crates/kortex-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kortex-pkg = { path = "../../crates/kortex-pkg" }

[dev-dependencies]
dioxus-ssr = "0.7.10"
