[package]
name = "kortex-flow"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "kortex_flow"
path = "src/lib.rs"

[[bin]]
name = "kortex-flow"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
kortex-shell = { path = "../../crates/kortex-shell" }
kortex-ui = { path = "../../crates/kortex-ui" }
kortex-i18n = { path = "../../crates/kortex-i18n" }
kortex-contract = { path = "../../crates/kortex-contract" }
kortex-runtime = { path = "../../crates/kortex-runtime" }
kortex-workflow = { path = "../../crates/kortex-workflow" }
kortex-platform = { path = "../../crates/kortex-platform", features = ["document"] }
dioxus = { version = "0.7.10", features = ["macro", "html", "signals", "hooks", "document", "launch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Desktop keeps HTTP-node secrets in the system credential store (see src/secrets.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kortex-platform = { path = "../../crates/kortex-platform", features = ["document", "secret-store"] }
