[package]
name = "kortex-seek"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "kortex_seek"
path = "src/lib.rs"

[[bin]]
name = "kortex-seek"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
kortex-shell = { path = "../../crates/kortex-shell" }
kortex-search = { path = "../../crates/kortex-search" }
kortex-ui = { path = "../../crates/kortex-ui" }
kortex-i18n = { path = "../../crates/kortex-i18n" }
dioxus = { version = "0.7.10", features = ["macro", "html", "signals", "hooks", "document", "launch"] }
