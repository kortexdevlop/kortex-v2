# SF Pro on Apple systems, the embedded Inter Variable everywhere else.
sans = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter Variable', system-ui, 'Segoe UI', sans-serif"
display = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter Variable', system-ui, 'Segoe UI', sans-serif"
mono = "ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
scale-sm = "0.875rem"
scale-0 = "1rem"
scale-1 = "1.1875rem"
scale-2 = "1.5rem"
scale-3 = "2rem"
scale-4 = "2.75rem"
scale-5 = "3.5rem"
scale-6 = "4.5rem"
weight-regular = "400"
weight-medium = "510"
weight-strong = "600"
weight-display = "650"
tracking-tight = "-0.011em"
tracking-display = "-0.036em"
