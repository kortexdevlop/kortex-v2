# SF Pro on Apple systems, the embedded Inter Variable everywhere else.
sans = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter Variable', system-ui, 'Segoe UI', sans-serif"
mono = "ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
scale-sm = "0.875rem"
scale-0 = "1rem"
scale-1 = "1.25rem"
scale-2 = "1.5625rem"
scale-3 = "1.953rem"
scale-4 = "2.441rem"
scale-5 = "3.052rem"
weight-regular = "420"
weight-medium = "520"
weight-strong = "620"
tracking-tight = "-0.018em"
tracking-display = "-0.035em"
