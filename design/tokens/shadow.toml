# Quiet elevation: hairlines carry structure, shadows only separate floating layers.
0 = "none"
1 = "0 1px 2px rgb(var(--k-shadow-ink) / .05)"
2 = "0 1px 2px rgb(var(--k-shadow-ink) / .04), 0 6px 18px rgb(var(--k-shadow-ink) / .05)"
3 = "0 2px 6px rgb(var(--k-shadow-ink) / .05), 0 14px 36px rgb(var(--k-shadow-ink) / .09)"
4 = "0 4px 12px rgb(var(--k-shadow-ink) / .06), 0 24px 60px rgb(var(--k-shadow-ink) / .13)"
5 = "0 8px 24px rgb(var(--k-shadow-ink) / .1), 0 40px 100px rgb(var(--k-shadow-ink) / .22)"
# Top specular line for glass chrome.
inset = "inset 0 1px 0 var(--k-glass-highlight)"
hairline = "0 0 0 1px var(--k-border)"
glow = "0 0 0 1px var(--k-accent), 0 0 0 4px var(--k-glow)"
ring = "0 0 0 4px var(--k-glow)"
