# Liquid Glass palette: frosted white, silver grey, graphite, glacier blue, rare luminous accents.
# [light]/[dark] emit the same variable names. Text pairs are WCAG AA on bg, surface and glass.
[light]
bg = "#eef1f5"
surface = "#f8f9fb"
surface-2 = "#e6eaf0"
text = "#0d1117"
text-2 = "#4b5563"
border = "rgb(13 17 23 / 0.09)"
accent = "#0066cc"
accent-2 = "#0b7fae"
accent-text = "#ffffff"
success = "#137333"
danger = "#c42b2b"
overlay = "rgb(238 241 245 / 0.66)"
# Glass material: translucent fill, hairline, top specular highlight, active glow.
glass = "rgb(255 255 255 / 0.58)"
glass-strong = "rgb(255 255 255 / 0.8)"
glass-border = "rgb(255 255 255 / 0.72)"
glass-edge = "rgb(13 17 23 / 0.08)"
glass-highlight = "rgb(255 255 255 / 0.9)"
glow = "rgb(0 102 204 / 0.28)"
sheen = "rgb(255 255 255 / 0.22)"
shadow-ink = "28 38 56"
# Ambient light behind the glass planes (page background), and universe hue lightness/chroma.
ambient-1 = "rgb(160 200 240 / 0.55)"
ambient-2 = "rgb(200 210 228 / 0.7)"
ambient-3 = "rgb(176 228 246 / 0.45)"
hue-l = "0.62"
hue-c = "0.14"
[dark]
bg = "#0b0d11"
surface = "#15181e"
surface-2 = "#1e222a"
text = "#f2f4f8"
text-2 = "#a4adbb"
border = "rgb(255 255 255 / 0.09)"
accent = "#4da3ff"
accent-2 = "#7dd3fc"
accent-text = "#04111f"
success = "#4ade80"
danger = "#f87171"
overlay = "rgb(8 10 14 / 0.62)"
glass = "rgb(30 34 42 / 0.52)"
glass-strong = "rgb(22 25 32 / 0.8)"
glass-border = "rgb(255 255 255 / 0.1)"
glass-edge = "rgb(0 0 0 / 0.45)"
glass-highlight = "rgb(255 255 255 / 0.12)"
glow = "rgb(77 163 255 / 0.4)"
sheen = "rgb(255 255 255 / 0.2)"
shadow-ink = "0 0 0"
ambient-1 = "rgb(40 84 140 / 0.42)"
ambient-2 = "rgb(46 52 66 / 0.6)"
ambient-3 = "rgb(30 110 140 / 0.28)"
hue-l = "0.74"
hue-c = "0.13"
