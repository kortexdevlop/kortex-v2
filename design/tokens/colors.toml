# Kortex Porcelain palette: opaque porcelain / graphite planes, ink primary, one rare blue accent.
# [light]/[dark] emit the same variable names. Text pairs are WCAG AA on bg, surface and surface-2.
[light]
bg = "#f7f7f8"
surface = "#ffffff"
surface-2 = "#f0f0f2"
surface-3 = "#e7e7ea"
text = "#0b0b0f"
text-2 = "#5a5e69"
border = "rgb(11 11 15 / 0.08)"
border-strong = "rgb(11 11 15 / 0.14)"
# Primary actions are drawn in ink (near-black), the accent stays for focus, links and selection.
ink = "#111114"
ink-text = "#ffffff"
accent = "#0066cc"
accent-2 = "#0b7fae"
accent-text = "#ffffff"
accent-soft = "rgb(0 102 204 / 0.08)"
success = "#137333"
danger = "#c42b2b"
warning = "#9a5b00"
overlay = "rgb(16 16 20 / 0.28)"
# Glass is reserved for floating chrome (navigation, palette, popovers, toolbars).
glass = "rgb(255 255 255 / 0.74)"
glass-strong = "rgb(255 255 255 / 0.88)"
glass-border = "rgb(255 255 255 / 0.6)"
glass-edge = "rgb(11 11 15 / 0.08)"
glass-highlight = "rgb(255 255 255 / 0.7)"
glow = "rgb(0 102 204 / 0.22)"
sheen = "rgb(255 255 255 / 0.08)"
shadow-ink = "16 18 24"
# Barely-there light at the top of the page and behind work canvases.
ambient-1 = "rgb(0 102 204 / 0.05)"
ambient-2 = "rgb(11 11 15 / 0.025)"
ambient-3 = "rgb(11 127 174 / 0.04)"
hue-l = "0.6"
hue-c = "0.14"
[dark]
bg = "#09090b"
surface = "#131316"
surface-2 = "#1b1b1f"
surface-3 = "#26262b"
text = "#f4f4f6"
text-2 = "#a3a3ad"
border = "rgb(255 255 255 / 0.08)"
border-strong = "rgb(255 255 255 / 0.14)"
ink = "#f4f4f6"
ink-text = "#09090b"
accent = "#4da3ff"
accent-2 = "#7dd3fc"
accent-text = "#04111f"
accent-soft = "rgb(77 163 255 / 0.12)"
success = "#4ade80"
danger = "#f87171"
warning = "#fbbf24"
overlay = "rgb(0 0 0 / 0.56)"
glass = "rgb(19 19 22 / 0.72)"
glass-strong = "rgb(22 22 26 / 0.88)"
glass-border = "rgb(255 255 255 / 0.08)"
glass-edge = "rgb(255 255 255 / 0.09)"
glass-highlight = "rgb(255 255 255 / 0.06)"
glow = "rgb(77 163 255 / 0.36)"
sheen = "rgb(255 255 255 / 0.06)"
shadow-ink = "0 0 0"
ambient-1 = "rgb(77 163 255 / 0.06)"
ambient-2 = "rgb(255 255 255 / 0.02)"
ambient-3 = "rgb(125 211 252 / 0.04)"
hue-l = "0.74"
hue-c = "0.13"
