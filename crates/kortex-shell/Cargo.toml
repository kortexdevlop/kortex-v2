[package]
name = "kortex-shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "document"] }
kortex-ui = { path = "../kortex-ui" }
kortex-platform = { path = "../kortex-platform", features = ["document"] }
kortex-catalog = { path = "../kortex-catalog" }
kortex-contract = { path = "../kortex-contract" }
kortex-i18n = { path = "../kortex-i18n" }
kortex-bus = { path = "../kortex-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
kortex-auth = { path = "../kortex-auth" }
kortex-sync = { path = "../kortex-sync" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kortex-pkg = { path = "../kortex-pkg" }
[dev-dependencies]
serde_json = "1"
