[package]
name = "kortex-cli"
version = "0.2.2"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kortex"
path = "src/main.rs"

[dependencies]
kortex-platform = { path = "../kortex-platform" }
kortex-contract = { path = "../kortex-contract" }
kortex-runtime = { path = "../kortex-runtime" }
kortex-pkg = { path = "../kortex-pkg" }
kortex-workflow = { path = "../kortex-workflow" }
serde_json = "1"

[dev-dependencies]
flate2 = "1"
serde_json = "1"
tar = { version = "0.4", default-features = false }
