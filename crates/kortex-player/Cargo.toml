[package]
name = "kortex-player"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "kortex_player"
path = "src/lib.rs"

[[bin]]
name = "kortex-player"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
kortex-platform = { path = "../kortex-platform", features = ["document"] }
kortex-ui = { path = "../kortex-ui" }
kortex-i18n = { path = "../kortex-i18n" }
kortex-runtime = { path = "../kortex-runtime" }
kortex-contract = { path = "../kortex-contract" }
dioxus = { version = "0.7.10", features = ["macro", "html", "signals", "hooks", "document", "launch"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kortex-engine-host = { path = "../kortex-engine-host" }
kortex-payload = { path = "../kortex-payload", features = ["region"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
kortex-payload = { path = "../kortex-payload" }
