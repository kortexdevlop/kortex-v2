[package]
name = "kortex-project"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
kortex-platform = { path = "../kortex-platform", optional = true }
kortex-contract = { path = "../kortex-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
persistence = ["dep:kortex-platform"]
