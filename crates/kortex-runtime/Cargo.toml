[package]
name = "kortex-runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Engine build (wasm32 only, ADR 0035): clock, entropy, progress and cancellation come from the
# `kx_host` imports of the engine ABI instead of `kortex-platform`, so an engine reaches no
# browser code.
engine-abi = []

[dependencies]
kortex-platform = { path = "../kortex-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
