name: credentials
on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - '.github/workflows/credentials.yml'
      - 'Cargo.lock'
      - 'crates/kortex-platform/**'
      - 'crates/kortex-pkg/**'
      - 'crates/kortex-cli/**'
concurrency:
  group: credentials-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            host: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macos
            host: aarch64-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-latest
            name: windows
            host: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: .kortex/target-credentials
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      KORTEX_SECRET_STORE_QA: isolated
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Detect native test target
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          test -n "$host"
          echo "CARGO_BUILD_TARGET=$host" >> "$GITHUB_ENV"
      - name: Native UI and isolated Secret Service prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev gnome-keyring dbus-x11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: .kortex/target-credentials
      - name: Isolated macOS test keychain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/kortex-credential-qa.keychain-db"
          security create-keychain -p 'public-ci-fixture' "$keychain"
          security unlock-keychain -p 'public-ci-fixture' "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - name: Migration and caller failure cases
        run: |
          set -euo pipefail
          cargo xtask tokens
          cargo test --locked -p kortex-pkg account::tests
          cargo test --locked -p kortex-cli --test account
      - name: Actual isolated Linux Secret Service roundtrip
        timeout-minutes: 3
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/kortex-secret-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/kortex-secret-config
        run: |
          set -euo pipefail
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "public-ci-fixture" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p kortex-platform --features secret-store secrets::tests::native_secret_roundtrip -- --ignored --exact
          '
      - name: Actual isolated macOS/Windows credential roundtrip
        timeout-minutes: 3
        if: runner.os != 'Linux'
        run: cargo test --locked -p kortex-platform --features secret-store secrets::tests::native_secret_roundtrip -- --ignored --exact
      - name: Compile native consumers for required architectures
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            rustup target add "$target"
            cargo build --locked --workspace --target "$target"
          done
          python - <<'PY'
          import hashlib,json,os,shutil,tomllib
          from pathlib import Path
          root=Path.cwd(); apps=json.loads(Path('registry/apps.json').read_text(encoding='utf-8'))['apps']
          manifests=[Path('crates/kortex-cli/Cargo.toml')]+[Path('apps')/e['app']['id'].removeprefix('apps.')/'Cargo.toml' for e in apps if e['app']['status'] in ['beta','stable']]
          for target in os.environ['TARGETS'].split():
              dest=root/'dist/credential-checks'/target;dest.mkdir(parents=True,exist_ok=True)
              binaries={}
              for manifest in manifests:
                  data=tomllib.loads(manifest.read_text(encoding='utf-8'));name=(data.get('bin') or [{'name':data['package']['name']}])[0]['name']+('.exe' if 'windows' in target else '')
                  source=root/os.environ['CARGO_TARGET_DIR']/target/'debug'/name
                  shutil.copy2(source,dest/name)
                  binaries[name]={'sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'version':data['package']['version']}
              (dest/'proof.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'target':target,'profile':'dev, debug symbols disabled','release':False,'roundtrip_host':os.environ['CARGO_BUILD_TARGET'],'roundtrip_passed':True,'binaries':binaries},indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: credential-consumers-${{ matrix.name }}
          path: dist/credential-checks/
          if-no-files-found: error
          retention-days: 7
      - name: Remove isolated macOS test keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/kortex-credential-qa.keychain-db"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DX_CLI_TELEMETRY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            .kortex/target-apps
            ~/.cache/dioxus
      - name: Existing pinned Dioxus compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dioxus"
          gh release download v0.7.10 --repo DioxusLabs/dioxus --pattern 'dx-x86_64-unknown-linux-gnu.tar.gz' --pattern 'dx-x86_64-unknown-linux-gnu.sha256' --dir "$RUNNER_TEMP/dioxus"
          cd "$RUNNER_TEMP/dioxus"
          sha256sum --check --ignore-missing dx-x86_64-unknown-linux-gnu.sha256
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          find "$RUNNER_TEMP/dioxus" -type f -name dx -exec chmod +x {} \;
          find "$RUNNER_TEMP/dioxus" -type f -name dx -printf '%h\n' >> "$GITHUB_PATH"
      - name: Prove web/native dependency isolation and compile common Store UI
        run: |
          set -euo pipefail
          mkdir -p .kortex/credential-checks
          cargo tree --locked -p kortex-store --target wasm32-unknown-unknown --no-default-features --features web -e normal --prefix none > .kortex/credential-checks/web-dependencies.txt
          if rg '^(keyring|keyring-core|apple-native-keyring-store|windows-native-keyring-store|zbus-secret-service-keyring-store) v' .kortex/credential-checks/web-dependencies.txt; then echo '::error::Native credential backend entered browser dependencies'; exit 1; fi
          cargo xtask tokens
          cargo xtask build-app apps.store --web
      - uses: actions/upload-artifact@v4
        with:
          name: credential-store-web-isolation
          path: |
            dist/apps/apps.store/
            .kortex/app-receipts/apps.store-web.json
            .kortex/credential-checks/web-dependencies.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
