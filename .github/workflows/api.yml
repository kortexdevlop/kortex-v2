name: api-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: api-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node --input-type=module <<'JS'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${process.env.GITHUB_SHA}&branch=main&event=push&per_page=20`;
          const response = await fetch(url, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
          if (!response.ok) throw Error('Unable to verify CI');
          const result = await response.json();
          if (!result.workflow_runs.some(run => run.head_sha === process.env.GITHUB_SHA && run.status === 'completed' && run.conclusion === 'success')) throw Error('Successful CI for this exact commit is required');
          JS
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check deployment credentials and administrator configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm exec --yes --package=wrangler@4.151.0 -- wrangler secret list --env production --config services/api/wrangler.jsonc > /tmp/kortex-api-secret-names.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const secrets = JSON.parse(readFileSync('/tmp/kortex-api-secret-names.json', 'utf8'));
          console.log('ADMIN_USER_IDS configured:', secrets.some(item => item.name === 'ADMIN_USER_IDS'));
          JS
      - name: Deploy API without changing database data or secrets
        run: |
          set -euo pipefail
          mkdir -p .kortex/publication
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --env production --config services/api/wrangler.jsonc | tee .kortex/publication/api-deploy.log
      - name: Verify live health and record deployment
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const response = await fetch('https://api.kortex.site/v1/health', {cache: 'no-store', redirect: 'error', signal: AbortSignal.timeout(30000)});
          if (!response.ok || (await response.json()).ok !== true) throw Error('Published API health check failed');
          const log = readFileSync('.kortex/publication/api-deploy.log', 'utf8');
          const version = /Current Version ID: ([a-f0-9-]+)/.exec(log)?.[1];
          if (!version) throw Error('Missing deployment version');
          writeFileSync('.kortex/publication/api-deployed.json', JSON.stringify({source_commit: process.env.GITHUB_SHA, version, health_verified: true}, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-publication-result
          path: .kortex/publication/
          if-no-files-found: warn
