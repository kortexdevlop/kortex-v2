name: release

# Builds the CLI, the Store and the desktop apps on Linux, macOS and Windows, signs the release index
# and (when RELEASES_TOKEN is set) publishes everything to the public binaries-only repo.
#
# Minutes are scarce on a private repository (macOS counts x10, Windows x2): this workflow only runs
# on `release/*` tags or by hand, never on push. See docs/guides/release.md.
on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Tool ids to build (space separated) or "all"'
        default: 'all'
      only:
        description: 'Run a single OS only: linux, macos, windows or all'
        type: choice
        options: [all, linux, macos, windows]
        default: all
      intel_mac:
        description: 'Also build macOS x86_64 (costs more minutes)'
        type: boolean
        default: true
      publish:
        description: 'Publish to kortex-releases (needs the RELEASES_TOKEN secret)'
        type: boolean
        default: false
  push:
    tags: ['release/*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.tools || 'all' }}
  INTEL_MAC: ${{ github.event_name == 'workflow_dispatch' && inputs.intel_mac || 'true' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || 'all' }}
        run: |
          all='[{"os":"ubuntu-latest","name":"linux","targets":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","name":"macos","targets":"aarch64-apple-darwin"},{"os":"windows-latest","name":"windows","targets":"x86_64-pc-windows-msvc"}]'
          if [ "$ONLY" = "all" ]; then m="$all"; else m=$(echo "$all" | jq -c --arg n "$ONLY" '[.[] | select(.name == $n)]'); fi
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Linux system libraries (webview and tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
          cache-directories: |
            .kortex/target-desktop
      - name: Extra macOS target
        if: runner.os == 'macOS' && env.INTEL_MAC == 'true'
        run: |
          rustup target add x86_64-apple-darwin
          echo "EXTRA_TARGETS=x86_64-apple-darwin" >> "$GITHUB_ENV"
      - name: Design tokens (embedded in every app)
        run: cargo xtask tokens
      - name: Validate contracts and catalogue
        run: cargo xtask check
      - name: Build, sign (macOS ad hoc) and package
        run: |
          set -euo pipefail
          if [ "$TOOLS" = "all" ]; then TOOL_LIST=$(cargo xtask list-tools); else TOOL_LIST="$TOOLS"; fi
          APP_LIST=$(python -c 'import json; print(" ".join(a["app"]["id"] for a in json.load(open("registry/apps.json", encoding="utf-8"))["apps"] if a["app"]["status"] in ["beta", "stable"]))')
          for target in ${{ matrix.targets }} ${EXTRA_TARGETS:-}; do
            cargo xtask build-cli --target "$target"
            for id in $APP_LIST; do cargo xtask build-app "$id" --target "$target"; done
            for id in $TOOL_LIST; do cargo xtask build-desktop "$id" --target "$target"; done
            if [ "$RUNNER_OS" = "macOS" ]; then
              # Free ad hoc signature: required to run on Apple Silicon. Gatekeeper still warns on browser
              # downloads; installs through the CLI/Store carry no quarantine flag. Paid signing can be
              # added here later without touching anything else.
              while IFS= read -r -d '' binary; do
                codesign --force --sign - "$binary"
                codesign --verify --strict "$binary"
              done < <(find "dist/desktop/$target" -type f -perm -u+x -print0)
            fi
            cargo xtask package cli --target "$target"
            for id in $APP_LIST; do cargo xtask package "$id" --target "$target"; done
            for id in $TOOL_LIST; do cargo xtask package "$id" --target "$target"; done
          done
          python scripts/verify-release-packages.py --tools "$TOOLS" --targets "${{ matrix.targets }} ${EXTRA_TARGETS:-}"
          ls -la dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            dist/release/*.tar.gz
            dist/release/build-proof-*.json
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
          cache-directories: |
            .kortex/target
            .kortex/target-worker
            .kortex/target-apps
            ~/.cache/dioxus
      - name: Existing Dioxus compiler (official pinned binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dioxus"
          gh release download v0.7.10 --repo DioxusLabs/dioxus --pattern 'dx-x86_64-unknown-linux-gnu.tar.gz' --pattern 'dx-x86_64-unknown-linux-gnu.sha256' --dir "$RUNNER_TEMP/dioxus"
          cd "$RUNNER_TEMP/dioxus"
          sha256sum --check --ignore-missing dx-x86_64-unknown-linux-gnu.sha256
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          find "$RUNNER_TEMP/dioxus" -type f -name dx -exec chmod +x {} \;
          find "$RUNNER_TEMP/dioxus" -type f -name dx -printf '%h\n' >> "$GITHUB_PATH"
      - name: Existing wasm-bindgen compiler (pinned to the worker contract)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-bindgen"
          gh release download 0.2.129 --repo wasm-bindgen/wasm-bindgen --pattern 'wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz' --dir "$RUNNER_TEMP/wasm-bindgen"
          cd "$RUNNER_TEMP/wasm-bindgen"
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz' | sha256sum --check
          tar -xzf wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          find "$RUNNER_TEMP/wasm-bindgen" -type f -name wasm-bindgen -printf '%h\n' >> "$GITHUB_PATH"
      - name: Compile all requested tools and released apps for WebAssembly
        env:
          DX_CLI_TELEMETRY: 'false'
        run: |
          set -euo pipefail
          cargo xtask tokens
          cargo xtask check
          if [ "$TOOLS" = "all" ]; then cargo xtask build all; else cargo xtask build $TOOLS; fi
          APP_LIST=$(python -c 'import json; print(" ".join(a["app"]["id"] for a in json.load(open("registry/apps.json", encoding="utf-8"))["apps"] if a["app"]["status"] in ["beta", "stable"]))')
          for id in $APP_LIST; do cargo xtask build-app "$id" --web; done
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundles-and-receipts
          path: |
            dist/run/
            dist/apps/
            .kortex/build/*/build-receipt.json
            .kortex/app-receipts/*-web.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7


  publish:
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/release
      - name: Release name
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"; else echo "tag=manual-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"; fi
      - name: Signed index (Ed25519)
        env:
          KORTEX_SIGNING_KEY: ${{ secrets.KORTEX_SIGNING_KEY }}
        run: |
          test -n "$KORTEX_SIGNING_KEY" || { echo "::error::secret KORTEX_SIGNING_KEY missing"; exit 1; }
          cargo xtask release-index --base-url "https://github.com/kortexdevlop/kortex-releases/releases/download/${{ steps.rel.outputs.tag }}"
          ls -la dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-index
          path: |
            dist/release/index.json
            dist/release/index.json.sig
            dist/release/cli-latest.txt
            dist/release/build-proof-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish to kortex-releases
        if: (github.event_name == 'push' || inputs.publish) && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "${{ steps.rel.outputs.tag }}" dist/release/* \
            --repo kortexdevlop/kortex-releases \
            --title "${{ steps.rel.outputs.tag }}" \
            --notes "Binaries and signed index. Source code is private; verify with the Kortex public key."
