name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    runs-on: ubuntu-latest   # Linux only: cheapest minutes (private repo budget, see MASTER_PROMPT §11)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Linux system libraries (desktop webview crates are part of the workspace)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Generated design CSS (embedded by the Store and desktop apps)
        run: cargo xtask tokens
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check
      - run: cargo test --workspace
      - name: Runner disk budget
        if: always()
        run: df -h "$GITHUB_WORKSPACE"
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask tokens
      - run: cargo xtask registry
      - run: cargo xtask icons
      - run: node --test scripts/tests/offline-routing.test.mjs scripts/tests/host-fallback.test.mjs
      - run: pnpm --filter @kortex/site test
      - run: pnpm site:build
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kortex/shared test
      - run: pnpm --filter @kortex/api typecheck
      - run: pnpm --filter @kortex/api test
