packages:
  - web/*
  - services/*
# Third-party install scripts are NOT run (`wrangler` is used from the global install for local dev).
allowBuilds:
  esbuild: false
  workerd: false
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.13.0'
  - '@astrojs/markdown-satteri@0.4.4'
  - '@astrojs/prism@4.1.0'
  - '@astrojs/telemetry@3.4.0'
  - astro@7.4.0
