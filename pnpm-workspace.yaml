packages:
  - web/*
  - services/*
allowBuilds:
  esbuild: set this to true or false
  workerd: set this to true or false
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.13.0'
  - '@astrojs/markdown-satteri@0.4.4'
  - '@astrojs/prism@4.1.0'
  - '@astrojs/telemetry@3.4.0'
  - astro@7.4.0

# Third-party install scripts are not run. `wrangler` is used from the global install for local dev.
ignoredBuiltDependencies:
  - esbuild
  - workerd
